<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="vBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b72c4"/>
      <stop offset="100%" stop-color="#143e8a"/>
    </linearGradient>
    <linearGradient id="vFilm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3139"/>
      <stop offset="100%" stop-color="#111317"/>
    </linearGradient>
    <filter id="vShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- Frame / Clapperboard -->
  <rect x="4" y="6" width="40" height="36" rx="4" fill="url(#vFilm)" stroke="#5b6270" stroke-width="1.5" filter="url(#vShadow)" />
  
  <!-- Film perforation holes -->
  <rect x="7" y="9" width="5" height="5" rx="1" fill="#e2e8f0"/>
  <rect x="15" y="9" width="5" height="5" rx="1" fill="#e2e8f0"/>
  <rect x="23" y="9" width="5" height="5" rx="1" fill="#e2e8f0"/>
  <rect x="31" y="9" width="5" height="5" rx="1" fill="#e2e8f0"/>
  <rect x="37" y="9" width="4" height="5" rx="1" fill="#e2e8f0"/>

  <rect x="7" y="34" width="5" height="5" rx="1" fill="#e2e8f0"/>
  <rect x="15" y="34" width="5" height="5" rx="1" fill="#e2e8f0"/>
  <rect x="23" y="34" width="5" height="5" rx="1" fill="#e2e8f0"/>
  <rect x="31" y="34" width="5" height="5" rx="1" fill="#e2e8f0"/>
  <rect x="37" y="34" width="4" height="5" rx="1" fill="#e2e8f0"/>

  <!-- Center Screen Display -->
  <rect x="7" y="16" width="34" height="16" rx="2" fill="#000000" stroke="#2563eb" stroke-width="1"/>
  
  <!-- Play Arrow Glowing -->
  <polygon points="20,19 31,24 20,29" fill="#38bdf8"/>
  <polygon points="20,19 31,24 20,29" fill="none" stroke="#ffffff" stroke-width="0.8"/>
</svg>
