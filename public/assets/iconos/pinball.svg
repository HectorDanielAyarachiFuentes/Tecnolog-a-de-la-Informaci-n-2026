<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#d4d4d8"/>
      <stop offset="70%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#27272a"/>
    </radialGradient>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="pShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>
  
  <!-- Cosmic Background Base -->
  <rect x="3" y="3" width="42" height="42" rx="8" fill="url(#spaceGrad)" stroke="#4338ca" stroke-width="1.5" filter="url(#pShadow)"/>
  
  <!-- Space Stars -->
  <circle cx="10" cy="12" r="1" fill="#fff" opacity="0.8"/>
  <circle cx="38" cy="10" r="1.2" fill="#38bdf8" opacity="0.9"/>
  <circle cx="34" cy="38" r="0.8" fill="#fff" opacity="0.7"/>
  <circle cx="12" cy="36" r="1" fill="#f43f5e" opacity="0.8"/>
  
  <!-- Pinball Track Rings / Orbit -->
  <ellipse cx="24" cy="24" rx="17" ry="9" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" transform="rotate(-25 24 24)" stroke-dasharray="32 6"/>
  <ellipse cx="24" cy="24" rx="13" ry="6" fill="none" stroke="#38bdf8" stroke-width="1.2" transform="rotate(-25 24 24)" opacity="0.6"/>

  <!-- Chrome Metallic Pinball Ball -->
  <circle cx="22" cy="22" r="11" fill="url(#ballGrad)" stroke="#52525b" stroke-width="0.8"/>
  <!-- Ball Specular Flare -->
  <ellipse cx="18" cy="18" rx="3.5" ry="2" fill="#ffffff" opacity="0.85" transform="rotate(-20 18 18)"/>

  <!-- Flipper Guides / Targets -->
  <polygon points="36,32 42,39 33,38" fill="#e11d48"/>
  <polygon points="12,32 6,39 15,38" fill="#e11d48"/>
  <polygon points="36,32 42,39 33,38" fill="none" stroke="#ffe4e6" stroke-width="0.7"/>
  <polygon points="12,32 6,39 15,38" fill="none" stroke="#ffe4e6" stroke-width="0.7"/>
</svg>
